name: AutoTrader.com
description: 'AutoTrader.com is an American online automotive marketplace headquartered in Atlanta,
  Georgia, and owned by Cox Automotive. Launched in 1997, it connects car buyers and sellers by
  aggregating listings for new, used, and certified pre-owned vehicles from franchise dealers,
  independent dealers, and private sellers. The site provides vehicle search and comparison,
  pricing and valuation tools, financing and trade-in estimates, dealer reviews, and lead-generation
  connections between shoppers and dealerships. It is a consumer-facing marketplace and does not
  publish a public developer API program; this profile tracks its public web and security posture
  in the API Evangelist network.'
